
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GSAP Scroll Animation</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: #111;
            color: white;
        }

        .gallery-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cards {
            position: relative;
            width: 100%;
            height: 500px;
        }

        .card {
            position: absolute;
            width: 276px;
            height: 400px;
            top: 50%;
            left: 50%;
            margin-left: -138px;
            margin-top: -200px;
            overflow: hidden;
            border-radius: 20px;
            will-change: transform;
            transform-origin: center center;
        }

        .card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .card-left {
            z-index: 1;
        }

        .card-right {
            z-index: 1;
        }

        .card-center {
            z-index: 3;
        }

        @media (max-width: 640px) {
            .card {
                width: 220px;
                height: 320px;
                margin-left: -110px;
                margin-top: -160px;
            }

            .cards {
                height: 400px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                will-change: auto;
            }
        }
    </style>
</head>

<body>

    <section class="gallery-section">

        <div class="container-hero w-full max-w-6xl mx-auto px-5 pt-20">

            <div class="text-center mb-10">

                <p class="text-orange-500 tracking-[5px] uppercase mb-3">
                    Our Collection
                </p>

                <h2 class="text-4xl md:text-6xl font-bold">
                    Explore Gallery
                </h2>

            </div>

            <div class="row-hero">

                <div class="cards">

                    <div class="card card-left">

                        <img
                            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000&auto=format&fit=crop"
                            alt="Nature landscape"
                        >

                    </div>

                    <div class="card card-right">

                        <img
                            src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1000&auto=format&fit=crop"
                            alt="Ocean view"
                        >

                    </div>

                    <div class="card card-center">

                        <img
                            src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1000&auto=format&fit=crop"
                            alt="Mountain landscape"
                        >

                    </div>

                </div>

            </div>

        </div>

    </section>


    <section class="min-h-screen flex items-center justify-center">

        <h2 class="text-5xl md:text-7xl font-bold text-center">
            THANK YOU
        </h2>

    </section>


    <script>

        gsap.registerPlugin(ScrollTrigger);

        const mm = gsap.matchMedia();


        mm.add("(min-width: 641px)", () => {

            gsap.set(".card-left", {
                x: 0,
                scale: 0.8,
                rotation: -8
            });

            gsap.set(".card-right", {
                x: 0,
                scale: 0.8,
                rotation: 8
            });

            gsap.set(".card-center", {
                x: 0,
                y: 0,
                scale: 1,
                rotation: 0
            });


            const tl = gsap.timeline({

                scrollTrigger: {
                    trigger: ".gallery-section",
                    start: "top top",
                    end: "+=1200",
                    scrub: 1,
                    pin: true,
                    pinSpacing: true,
                    anticipatePin: 1,
                    invalidateOnRefresh: true
                }

            });


            tl.to(".card-left", {

                x: -180,
                scale: 1,
                rotation: -10,
                ease: "power2.out",
                duration: 1

            }, 0);


            tl.to(".card-right", {

                x: 180,
                scale: 1,
                rotation: 10,
                ease: "power2.out",
                duration: 1

            }, 0);


            tl.to(".card-center", {

                scale: 1.12,
                y: -15,
                ease: "power2.out",
                duration: 1

            }, 0);


            return () => {

                tl.scrollTrigger?.kill();
                tl.kill();

            };

        });


        window.addEventListener("load", () => {

            ScrollTrigger.refresh();

        });

    </script>

</body>
</html>
