
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Scroll Animation</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
        }

        .cards {
            position: relative;
            width: 100%;
            height: 500px;
        }

        .card {
            position: absolute;
            width: 276px;
            height: 400px;
            top: 50%;
            left: 50%;
            margin-left: -138px;
            margin-top: -200px;
            overflow: hidden;
            border-radius: 20px;
            will-change: transform;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-left {
            z-index: 1;
            transform: translateX(-130px) scale(.8) rotate(-8deg);
        }

        .card-right {
            z-index: 1;
            transform: translateX(130px) scale(.8) rotate(8deg);
        }

        .card-center {
            z-index: 3;
        }

        @media (max-width: 640px) {
            .card {
                width: 220px;
                height: 320px;
                margin-left: -110px;
                margin-top: -160px;
            }

            .cards {
                height: 400px;
            }
        }
    </style>
</head>

<body>



    <!-- Gallery Section -->
    <section class="gallery-section min-h-screen flex items-center justify-center overflow-hidden">

        <div class="container-hero w-full max-w-6xl mx-auto px-5">

            <div class="text-center mb-10">
                <p class="text-orange-500 tracking-[5px] uppercase mb-3">
                    Our Collection
                </p>

                <h2 class="text-4xl md:text-6xl font-bold">
                    Explore Gallery
                </h2>
            </div>

            <div class="row-hero">

                <div class="cards">

                    <!-- Left Card -->
                    <div class="card card-left">
                        <img
                            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000&auto=format&fit=crop"
                            alt="Nature landscape">
                    </div>

                    <!-- Right Card -->
                    <div class="card card-right">
                        <img
                            src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1000&auto=format&fit=crop"
                            alt="Ocean view">
                    </div>

                    <!-- Center Card -->
                    <div class="card card-center">
                        <img
                            src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1000&auto=format&fit=crop"
                            alt="Mountain landscape">
                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Bottom Section -->
    <div class="min-h-screen flex items-center justify-center">
        <h2 class="text-5xl md:text-7xl font-bold text-center">
            THANK YOU
        </h2>
    </div>


    <script>

        const mm = gsap.matchMedia();

mm.add("(min-width: 641px)", () => {

    // Initial position
    gsap.set(".card-left", {
        x: 0,
        scale: 0.8,
        rotation: -8
    });

    gsap.set(".card-right", {
        x: 0,
        scale: 0.8,
        rotation: 8
    });

    gsap.set(".card-center", {
        x: 0,
        scale: 1,
        rotation: 0
    });

    const tl = gsap.timeline({
        scrollTrigger: {
            trigger: ".gallery-section",
            start: "top top",
            end: "+=1200",
            scrub: 1,
            pin: true,
            anticipatePin: 1
        }
    });

    tl.to(".card-left", {
        x: -150,
        scale: 1,
        rotation: -10,
        duration: 1,
        ease: "power2.out"
    }, 0);

    tl.to(".card-right", {
        x: 150,
        scale: 1,
        rotation: 10,
        duration: 1,
        ease: "power2.out"
    }, 0);

    tl.to(".card-center", {
        scale: 1.12,
        y: -15,
        duration: 1,
        ease: "power2.out"
    }, 0);

    return () => {
        tl.scrollTrigger?.kill();
        tl.kill();
    };

});


    </script>

</body>
</html>
